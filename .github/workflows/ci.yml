name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src api

      - name: Type-check (mypy)
        run: mypy src api

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: noaa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: noaa_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d noaa_test \
            -f sql/schema/001_create_tables.sql \
            -f sql/schema/002_create_indexes.sql

      - name: Run tests
        run: pytest --cov=noaa_etl --cov=api --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  dbt-compile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: noaa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: noaa_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-postgres dbt-utils

      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d noaa_test \
            -f sql/schema/001_create_tables.sql \
            -f sql/schema/002_create_indexes.sql

      - name: dbt deps + compile
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt compile --profiles-dir . --target dev
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: noaa_test
          DB_USER: postgres
          DB_PASSWORD: postgres
