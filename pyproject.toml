[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "noaa-etl"
version = "0.1.0"
description = "ETL pipeline for NOAA Emergency Response Imagery to PostGIS data warehouse"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "requests>=2.31",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "prometheus-fastapi-instrumentator>=7.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]
spark = [
    "pyspark>=3.5",
    "boto3>=1.34",
    "rasterio>=1.3",
]

[project.scripts]
noaa-etl = "noaa_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=noaa_etl --cov-report=term-missing"
