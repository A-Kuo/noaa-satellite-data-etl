# Spark defaults for the NOAA ETL cluster
spark.master                         spark://spark-master:7077
spark.driver.memory                  2g
spark.executor.memory                4g
spark.executor.cores                 2
spark.sql.adaptive.enabled           true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.skewJoin.enabled  true

# PostgreSQL JDBC driver (bundled in the Spark image via packages)
spark.jars.packages                  org.postgresql:postgresql:42.7.3

# Parquet compression
spark.sql.parquet.compression.codec  snappy

# Event log — mount a shared volume to persist across restarts
spark.eventLog.enabled               true
spark.eventLog.dir                   /opt/spark/logs
