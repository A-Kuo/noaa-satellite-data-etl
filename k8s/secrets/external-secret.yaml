# Requires External Secrets Operator (https://external-secrets.io) and an
# AWS Secrets Manager secret named "noaa-etl/prod" with these keys:
#   db-host, db-name, db-user, db-password, api-keys
#
# Install ESO:  helm install eso external-secrets/external-secrets -n external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1   # override with your AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: noaa-etl-sa   # IRSA service account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: noaa-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: noaa-db-secret
    creationPolicy: Owner
  data:
    - secretKey: db-host
      remoteRef:
        key: noaa-etl/prod
        property: db-host
    - secretKey: db-name
      remoteRef:
        key: noaa-etl/prod
        property: db-name
    - secretKey: db-user
      remoteRef:
        key: noaa-etl/prod
        property: db-user
    - secretKey: db-password
      remoteRef:
        key: noaa-etl/prod
        property: db-password
    - secretKey: api-keys
      remoteRef:
        key: noaa-etl/prod
        property: api-keys
